[package]
name = "text-on-screen"
version = "0.1.0"
description = "Always-on-top text overlay for live streams"
authors = ["Text on Screen"]
edition = "2021"

[lib]
name = "text_on_screen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.0.0", features = [] }

[dependencies]
tauri = { version = "=2.0.0", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
plist = "=1.6.1"
tauri-runtime = "=2.0.0"
tauri-runtime-wry = "=2.0.0"
tauri-utils = "=2.0.0"
time = "=0.3.36"
time-core = "=0.1.2"
time-macros = "=0.2.18"
indexmap = "=2.13.0"
